apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: snaptrude-hpa
  namespace: snaptrude
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: snaptrude-js-app
  minReplicas: 1
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70